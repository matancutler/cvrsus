<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cursus — Two minutes now. Opportunities chase you later.</title>
    <meta
      name="description"
      content="Cursus is a talent marketplace built around your profile. Upload your CV once and let relevant companies find you."
    />
    <!--
      One SVG covers every size. §1 inverts it: a white tile carrying the
      oxblood mark, matching the logo on the header bar. It still needs no
      prefers-color-scheme declaration, because the tile is opaque and the mark
      never sits directly on the browser's own chrome.
    -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="theme-color" content="#7A2E2A" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
